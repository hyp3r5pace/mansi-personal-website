<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!--
    Jali-inspired lattice tile. Eight-pointed star nested in a square,
    common in Mughal screen work. Drawn as a single stroked path so it
    tiles cleanly when referenced as a CSS background-image.
  -->
  <g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="76" height="76" />
    <path d="M40 8 L52 28 L72 28 L56 42 L62 62 L40 50 L18 62 L24 42 L8 28 L28 28 Z" />
    <circle cx="40" cy="40" r="6" />
  </g>
</svg>
